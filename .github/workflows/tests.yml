name: Tests

# The ownership tests spawn real processes, bind real sockets and send real
# signals, and the defects they guard against are platform-specific by nature: a
# pid is a different kind of object on each OS, and identity is read from a
# different place on each one (Win32_Process, /proc, ps). Four of the defects
# found reviewing this suite's own subject were POSIX-only, and every one of them
# was invisible to a green Windows run — so the matrix is the test, not a bonus.
#
# The Node suite needs no litert-lm, GPU or network: the fake launcher it uses is a copy
# of node. The Python suite does install the litert-lm package, for its header schema and
# config module, but loads no model. So a green run here is NOT evidence of real inference
# or accelerator compatibility; nothing in this workflow exercises either.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never stop the other legs early. A macOS-only failure is the single most
      # useful signal this workflow can produce, and cancelling the run that
      # proves the others still pass would throw away the comparison.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record what identity will actually be read from
        shell: bash
        run: |
          echo "os      : $(uname -a 2>/dev/null || ver)"
          echo "node    : $(node --version)"
          for t in lsof ss ps; do
            printf '%-5s -> %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          # macOS has no /proc, so `ps -o lstart=` is the only identity source
          # there — this line is how a reader tells which path the run exercised.
          echo "/proc   : $([ -d /proc ] && echo present || echo ABSENT)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse-check every script
        shell: bash
        run: |
          for f in plugins/litertlm/scripts/*.mjs tests/*.mjs; do node --check "$f"; done
          python -m py_compile plugins/litertlm/tools/*.py

      - run: node --test "tests/*.test.mjs"

      # The header-repair tests skip themselves without the runtime, so a failed install
      # would otherwise look like a pass. The --help call is what makes that a failure.
      - name: Install the runtime the Python tests need
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check litert-lm
          python plugins/litertlm/tools/litertlm_backend.py --help > /dev/null

      - run: python -m unittest discover -s tests -p "test_*.py"
